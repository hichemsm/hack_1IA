[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Aevum tourne en EVM Shanghai : pas de TSTORE/TLOAD, MCOPY ni opcodes blob (Cancun)
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
aevum = "${AEVUM_RPC_URL}"
